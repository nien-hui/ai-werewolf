[project]
name = "who-is-human"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.146.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
